<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A responsive interactive multiple-choice quiz application.">
  <title>Interactive Quiz Application</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="quiz-shell">
    <header class="hero">
      <p class="eyebrow">LEARN • PRACTISE • IMPROVE</p>
      <h1>Quick Knowledge Quiz</h1>
      <p>Answer each question and see your score at the end.</p>
    </header>
    <section class="quiz-card" aria-live="polite">
      <div class="progress-row">
        <span id="question-count">Question 1 of 5</span>
        <span id="score-label">Score: 0</span>
      </div>
      <div class="progress-track"><div id="progress-bar"></div></div>
      <h2 id="question-text">Loading question…</h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback" role="status"></p>
      <button id="next-button" class="primary-button" disabled>Next question</button>
      <div id="result" class="result hidden"></div>
      <button id="restart-button" class="secondary-button hidden">Try again</button>
    </section>
    <footer>Built with HTML, CSS and JavaScript.</footer>
  </main>
</body>
</html>
